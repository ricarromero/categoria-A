<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Liga Universitaria Sanjuanina de Fútbol — Categoría A 2026</title>
  <meta name="description"
    content="Liga Universitaria Sanjuanina de Fútbol — Categoría A 2026. Tablas de posiciones, fixture, resultados, goleadores, sanciones y estadísticas completas.">

  <!-- Google Fonts: Big Shoulders Display & Archivo -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Archivo:ital,wght@0,400;0,500;0,600;0,700;0,800;1,400&family=Big+Shoulders+Display:wght@600;700;800;900&display=swap"
    rel="stylesheet">

  <!-- Favicon Oficial -->
  <link rel="icon" type="image/png" href="public/logo_liga.png">

  <!-- Estilos Premium -->
  <link rel="stylesheet" href="css/styles.css?v=20261030_v13">
</head>

<body>

  <!-- =========================================================================
       CABECERA: ESTADIO Y MARCADOR
       ========================================================================= -->
  <header class="hero-stadium">
    <!-- Líneas de Cal Vectoriales de la Cancha -->
    <div class="pitch-overlay" aria-hidden="true">
      <svg class="pitch-lines" viewBox="0 0 1200 320" preserveAspectRatio="none">
        <!-- Borde exterior de campo -->
        <rect x="20" y="20" width="1160" height="280" rx="8" />
        <!-- Línea central -->
        <line x1="600" y1="20" x2="600" y2="300" />
        <!-- Círculo central y punto -->
        <circle cx="600" cy="160" r="70" />
        <circle cx="600" cy="160" r="3.5" style="fill: var(--chalk); stroke: none;" />
        <!-- Área Grande Izquierda -->
        <rect x="20" y="70" width="140" height="180" />
        <!-- Área Chica Izquierda -->
        <rect x="20" y="115" width="55" height="90" />
        <!-- Punto penal izquierdo -->
        <circle cx="110" cy="160" r="3" style="fill: var(--chalk); stroke: none;" />
        <!-- Área Grande Derecha -->
        <rect x="1040" y="70" width="140" height="180" />
        <!-- Área Chica Derecha -->
        <rect x="1125" y="115" width="55" height="90" />
        <!-- Punto penal derecho -->
        <circle cx="1090" cy="160" r="3" style="fill: var(--chalk); stroke: none;" />
      </svg>
    </div>

    <div class="container hero-content">
      <!-- Identidad Oficial -->
      <div class="hero-brand">
        <div class="brand-main">
          <div class="cat-switch" id="catSwitch" role="group" aria-label="Elegir categoría">
            <button type="button" class="cat-pick" data-cat="A" title="Categoría A">A</button>
            <button type="button" class="cat-pick" data-cat="B" title="Categoría B">B</button>
            <button type="button" class="cat-pick" data-cat="C" title="Categoría C">C</button>
          </div>
          <div class="brand-text brand-v2">
            <img src="public/logo_liga.png" alt="La Liga Universitaria" class="league-official-logo">
            <span class="brand-div" aria-hidden="true"></span>
            <div class="brand-info">
              <span class="brand-cat" id="heroCatLabel">Categoría A</span>
              <span class="brand-sub"><span class="brand-sub-long">Fútbol Universitario · </span>UNSJ · Temporada 2026</span>
            </div>
          </div>
        </div>

        <a href="https://www.instagram.com/ligauniversitaria.sj/" target="_blank" rel="noopener noreferrer" class="hero-ig" title="Instagram: @ligauniversitaria.sj" aria-label="Instagram @ligauniversitaria.sj">
          <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <rect x="2" y="2" width="20" height="20" rx="5" ry="5"></rect>
            <path d="M16 11.37A4 4 0 1 1 12.63 8 4 4 0 0 1 16 11.37z"></path>
            <line x1="17.5" y1="6.5" x2="17.51" y2="6.5"></line>
          </svg>
        </a>
      </div>

      <!-- Marcador del Estadio (Hero Board) -->
      <div class="hero-board" id="heroBoard">
        <!-- Renderizado dinámico vía app.js -->
      </div>
    </div>
  </header>

  <!-- =========================================================================
       NAVBAR STICKY DE PESTAÑAS CON INDICADOR DESLIZANTE
       ========================================================================= -->
  <nav class="navbar-sticky" aria-label="Navegación principal">
    <div class="container">
      <div class="tabs-nav" id="mainTabs" role="tablist">
        <button class="tab-btn tab-challenger" data-view="challenger" role="tab" aria-selected="false">
          <span></span> Copa Challenger
        </button>
        <button class="tab-btn active" data-view="posiciones" role="tab" aria-selected="true">
          <span></span> Posiciones
        </button>
        <button class="tab-btn" data-view="fixture" role="tab" aria-selected="false">
          <span></span> Fixture
        </button>
        <button class="tab-btn" data-view="equipos" role="tab" aria-selected="false">
          <span></span> Equipos
        </button>
        <button class="tab-btn" data-view="estadisticas" role="tab" aria-selected="false">
          <span></span> Estadísticas
        </button>
        <button class="tab-btn" data-view="goleadores" role="tab" aria-selected="false">
          <span></span> Goleadores
        </button>
        <button class="tab-btn" data-view="sanciones" role="tab" aria-selected="false">
          <span></span> Sanciones
        </button>
        <button class="tab-btn" data-view="reglamento" role="tab" aria-selected="false">
          <span></span> Reglamento
        </button>
        <div class="tab-indicator" id="tabIndicator"></div>
      </div>
    </div>
  </nav>

  <!-- =========================================================================
       ÁREA DE CONTENIDO (7 SECCIONES)
       ========================================================================= -->
  <main class="content-area">
    <div class="container">
      <!-- Sección A: Posiciones -->
      <section id="view-posiciones" class="view-section active" role="tabpanel">
        <!-- Dinámico -->
      </section>

      <!-- Sección B: Fixture -->
      <section id="view-fixture" class="view-section" role="tabpanel">
        <!-- Dinámico -->
      </section>

      <!-- Copa Challenger -->
      <section id="view-challenger" class="view-section" role="tabpanel">
        <!-- Dinámico -->
      </section>

      <!-- Sección C: Equipos -->
      <section id="view-equipos" class="view-section" role="tabpanel">
        <!-- Dinámico -->
      </section>

      <!-- Sección D: Estadísticas -->
      <section id="view-estadisticas" class="view-section" role="tabpanel">
        <!-- Dinámico -->
      </section>

      <!-- Sección E: Goleadores -->
      <section id="view-goleadores" class="view-section" role="tabpanel">
        <!-- Dinámico -->
      </section>

      <!-- Sección F: Sanciones -->
      <section id="view-sanciones" class="view-section" role="tabpanel">
        <!-- Dinámico -->
      </section>

      <!-- Sección G: Reglamento -->
      <section id="view-reglamento" class="view-section" role="tabpanel">
        <!-- Dinámico -->
      </section>
    </div>
  </main>

  <!-- =========================================================================
       MODAL DE FICHA DE EQUIPO
       ========================================================================= -->
  <div id="teamModal" class="modal-backdrop" aria-hidden="true" role="dialog" aria-modal="true">
    <div class="modal-container" id="teamModalContent">
      <button class="modal-close-btn" id="modalClose" aria-label="Cerrar Ficha">&times;</button>
      <div id="teamModalBody"></div>
    </div>
  </div>

  <!-- =========================================================================
       PIE DE PÁGINA INSTITUCIONAL
       ========================================================================= -->
  <footer class="page-footer">
    <div class="container footer-inner">
      <div class="footer-brand">
        <img src="public/logo_liga.png" alt="La Liga Universitaria" class="footer-league-logo">
      </div>
      <div class="footer-copy">
        Liga Universitaria Sanjuanina de Fútbol · <b id="footerCat">Categoría A · Temporada 2026</b><br>
        Portal de seguimiento deportivo, fixture, resultados, goleadores y estadísticas de los equipos.
      </div>
      <div class="footer-social">
        <a href="https://www.instagram.com/ligauniversitaria.sj/" target="_blank" rel="noopener noreferrer" class="footer-ig-link" title="Instagram Oficial: @ligauniversitaria.sj">
          <svg class="ig-svg-icon" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <rect x="2" y="2" width="20" height="20" rx="5" ry="5"></rect>
            <path d="M16 11.37A4 4 0 1 1 12.63 8 4 4 0 0 1 16 11.37z"></path>
            <line x1="17.5" y1="6.5" x2="17.51" y2="6.5"></line>
          </svg>
          <span>@ligauniversitaria.sj</span>
        </a>
      </div>
    </div>
  </footer>

  <!-- Scripts: Datos Oficiales y Lógica Reactiva -->
  <script src="js/data.js?v=20261030_v13"></script>
  <script src="js/data_bc.js?v=20261030_v13"></script>
  <script src="js/app.js?v=20261030_v13"></script>
</body>

</html>
